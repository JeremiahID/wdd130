<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <h1>☑️ HTML and CSS Quiz</h1>

    <form>
        <!-- Question 1: Text Input -->
        <label for="q1">1. What does HTML stand for?</label>
        <input type="text" id="q1" name="q1">

        <br><br>

        <!-- Question 2: Textarea -->
        <label for="q2">2. What is the purpose of CSS in a web page?</label>
        <textarea id="q2" name="q2" rows="4" cols="40"></textarea>

        <br><br>

        <!-- Question 3: Select -->
        <label for="q3">3. Which HTML element is used to create a hyperlink?</label>
        <select id="q3" name="q3">
            <option value="" selected disabled>Choose One ...</option>
            <option value="p">&lt;p&gt;</option>
            <option value="a">&lt;a&gt;</option>
            <option value="img">&lt;img&gt;</option>
            <option value="link">&lt;link&gt;</option>
        </select>

        <br><br>

        <!-- Question 4: Number Input -->
        <label for="q4">4. How many levels of headings are available in HTML?</label>
        <input type="number" id="q4" name="q4">

        <br><br>

        <button type="submit">Submit Quiz</button>
    </form>

</body>

</html>
