<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> contact us </title>
    <meta name="description" content="Idahosa Jeremiah's BYU-Idaho WDD 130 Contact us home page.">
    <meta name="author" content="Idahosa Jeremiah Efe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/z-wwr-blue.jpg" alt="logo">
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="company-information">
            <h1>White Water Rafting Company</h1>
            <p> 132 Main River Street </p>
            <p> Kolob California</p>
            <p>+122 999 665 787</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Contact section -->
        <section class="contact-section">
        
            <!-- Map -->
            <div class="map">
                <div class="map-marker">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d393436.832924525!2d-106.11487031939804!3d39.61087111305095!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sBreckenridge%20Whitewater%20Rafting!5e0!3m2!1sen!2sng!4v1790607669404!5m2!1sen!2sng"
                       allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>
        
            <!-- Contact Form -->
            <div class="contact-form">
        
                <form>
        
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Name">
                    </div>
        
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email">
                    </div>
        
                    <div class="purpose-row">
                        <label>Message<br>Purpose</label>
        
                        <div class="radio-options">
                            <label>
                                <input type="radio" id="purpose" name="purpose" value="general" checked>
                                General Inquiry
                            </label>
        
                            <label>
                                <input type="radio" id="purpose" name="purpose" value="reservation">
                                Reservation Question
                            </label>
        
                            <label>
                                <input type="radio" id="purpose" name="purpose" value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>
        
                    <div class="message-row">
                        <label for="message">Message</label>
        
                        <textarea id="message" name="message" placeholder="Type here"></textarea>
                    </div>
        
                    <label class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please Subscribe me to the monthly newsletter
                    </label>
        
                    <button type="submit">Get in Touch!</button>
        
                </form>
        
            </div>
        
        </section>
        
        
        <!-- Employee Section -->
        <section class="employees">
        
            <h2>We Are Here to Serve You</h2>
        
            <div class="employee-container">
        
                <div class="employee">
                    <div class="profile-image">
                        <span>👤</span>
                    </div>
                    <p>Employee Profile</p>
                </div>
        
                <div class="employee">
                    <div class="profile-image">
                        <span>👤</span>
                    </div>
                    <p>Employee Profile</p>
                </div>
        
                <div class="employee">
                    <div class="profile-image">
                        <span>👤</span>
                    </div>
                    <p>Employee Profile</p>
                </div>
        
            </div>
        
        </section>

    </main>

    <footer>
        <p>&copy; 2026 💦 Exciting Expeditions 💦 Idahosa Jeremiah.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
